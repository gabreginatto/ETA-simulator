# Cloud Build configuration for ETA-Simulator
# Builds container and deploys to Cloud Run
#
# To trigger manually:
#   gcloud builds submit --config=cloudbuild.yaml
#
# To set up automatic triggers:
#   gcloud builds triggers create github \
#     --name="eta-simulator-deploy" \
#     --repo-name="ETA-simulator" \
#     --repo-owner="YOUR_GITHUB_USER" \
#     --branch-pattern="^main$" \
#     --build-config="cloudbuild.yaml"

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: eta-simulator
  _CLOUD_SQL_INSTANCE: eta-sim-pg

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eta-simulator/app:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eta-simulator/app:latest'
      - '.'
    id: 'build'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eta-simulator/app'
    id: 'push'
    waitFor: ['build']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/eta-simulator/app:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_CLOUD_SQL_INSTANCE}'
      - '--allow-unauthenticated'  # IAP handles auth at load balancer level
      - '--min-instances=0'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=300'
      - '--concurrency=80'
    id: 'deploy'
    waitFor: ['push']

# Store images in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eta-simulator/app:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/eta-simulator/app:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Build timeout (30 minutes)
timeout: '1800s'
